name: Deploy teacher workspace to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stamp asset versions
        # Turns ?v=__BUILD__ in index.html into ?v=<commit>, so every deploy busts the browser cache.
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" index.html
          grep -c "?v=${GITHUB_SHA::7}" index.html
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
